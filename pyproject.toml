[project]
name = "nanorts"
version = "0.1.0"
description = "Accelerator-native JAX reimplementation of MicroRTS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jax[cuda13]>=0.11.1",
    "nvidia-cuda-nvcc>=13.3; sys_platform == 'linux'",
    "jaxmarl>=0.2.0, <0.3",
    "numpy",
    "imageio",
    "pygame",
    "flax>=0.12.9",
    "optax>=0.2.8",
    "pyyaml>=6.0",
    "wandb>=0.22",
]

[project.scripts]
play = "nanorts.play:main"
train = "baselines.ppo:train_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanorts", "baselines"]
